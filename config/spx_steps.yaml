# Flow CSV rows with no spx parameters (carbon_eda/spxsteps.py):
#   not an spx function (clean, ...) -> no-op custom step
#   type under zero_fill             -> run with its cells (0 values, structure unchanged)
#   type under parameterless         -> run as written
#   anything else                    -> error

# cells: spx parameters, in flow CSV syntax.
# ask (default true): make spx asks first (ZERO_FILL=1 to skip) and the report lists the steps as
# gaps; false for steps that change no geometry.
zero_fill:
  anneal:
    ask: false
    cells:
      # (time, start T, end T, partial pressures); unit C, not degC
      TemperatureRamp: "py:[((0.0, qupy.Unit('min')), (0.0, qupy.Unit('C')), (0.0, qupy.Unit('C')), [])]"
  implant_ellipsoid:
    ask: false
    cells:
      AffectedMaterialsFilter: "py:[]"
      MaterialFilter: Silicon         # exactly one existing material
      Depth: 0.0 um
      Primary: 0.0 um
      Lateral: 0.0 um
      RemoveEmptyRegions: "py:True"   # else the step leaves an empty region named after it

parameterless: [flip_structure]

# ---- generated by `python -m carbon_eda spx-functions`, which rewrites everything below this line
spx_version: W-2024.09-SP1
functions: [
  LayoutState, LicenseFeature, ScalarFieldColorMap, anneal, application, arithmetic_step,
  bond_structure, clip, clipstate, close, connect, control_pause, control_save_3D, control_screenshot,
