# How spx runs flow CSV rows that exist for the carbon model but have nothing for spx to do
# (carbon_eda/spxsteps.py). The CSV is never changed, so the carbon numbers stay as they are.
#
#   step type with no spx.procedural function (clean, marking, ...), no spx parameters
#       -> a no-op custom step that returns the structure unchanged
#   step type below with no spx parameters
#       -> its zero_fill cells; make spx asks before running them (ZERO_FILL=1 to agree in advance)
#   anything else with no spx parameters, unless listed under parameterless, or a step type with no
#   spx.procedural function that sets spx parameters
#       -> error (make test, make spx)

# Cells as in the flow CSV (see carbon_eda/csvio.py). Checked in spx W-2024.09-SP1: the structure
# is unchanged after these steps.
zero_fill:
  anneal:
    # (time, start temperature, end temperature, partial pressures); the unit is C, not degC
    TemperatureRamp: "py:[((0.0, qupy.Unit('min')), (0.0, qupy.Unit('C')), (0.0, qupy.Unit('C')), [])]"
  implant_ellipsoid:
    AffectedMaterialsFilter: "py:[]"
    MaterialFilter: Silicon             # must name exactly one existing material
    Depth: 0.0 um
    Primary: 0.0 um
    Lateral: 0.0 um
    # Without it the step leaves an empty region named after it. It also removes every other empty
    # region in the structure (stripped photoresist, ...); the geometry is the same either way.
    RemoveEmptyRegions: "py:True"

# Step types that take no parameters.
parameterless: [flip_structure]

# ---- generated by `python -m carbon_eda spx-functions`, which rewrites everything below this line
spx_version: W-2024.09-SP1
functions: [
  LayoutState, LicenseFeature, ScalarFieldColorMap, anneal, application, arithmetic_step,
  bond_structure, clip, clipstate, close, connect, control_pause, control_save_3D, control_screenshot,
