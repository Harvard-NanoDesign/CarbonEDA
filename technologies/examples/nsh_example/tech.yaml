# nsh_example: a 2 nm-class nanosheet (GAA) logic flow from the wafer start up to the first metal (M0):
# buried power rail, nanosheet stack and fin, STI, dummy gate, inner spacers and S/D epi (N and P),
# replacement metal gate (N and P), gate cut, MOL contacts (VSD, VG), then M0.
# It is a full nanosheet flow cut after its M0 module, so it has no BEOL above M0 and no backside
# (no carrier wafer bond).
# The layout is a generated test pattern holding only the layers these steps use.
# The flow CSV that is run (other CSVs in this folder are not read).
csv: nsh_example.csv
layout: nsh_example_layout.gds
clip:
  name: nsh_example
  coords: [0.023, -0.016, 0.607, 0.304]   # x0 y0 x1 y1 (um): the layout inset ~5% per side, so the 3D view cuts through the metal

# Set to also report carbon per die.
die_area_mm2: null

# svisual views for each step (carbon_eda/svisual_render.tcl).
render:
  resolution: 1024x768
  zoom_box: null   # [x0, x1, y0, y1, z0, z1] in um; null = whole structure
  # Cut planes, e.g. [{axis: z, at: 0.0, range: {y: [-0.1, 0.1], x: [-0.1, 0.1]}}].
  # Ranges are applied in the order listed; svisual keeps the aspect ratio, so the last one wins.
  cuts:   # x through a gate (fins / nanosheets in cross-section), y along a fin / nanosheet
    - {axis: x, at: 0.29375}
    - {axis: y, at: 0.18375}
